<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário IT — demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--card-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--bg:#F5F6F8;--surface:#FFF;--surface2:#F9FAFB;--border:#E5E7EB;--divider:#F1F2F4;--text:#111827;--text2:#374151;--muted:#4B5563;--input:#D1D5DB;--accent:#2563EB;--accent-weak:#EFF6FF;--accent-border:#BFDBFE;--danger:#B91C1C;--warn:#C2410C;--ok:#15803D;--link:#1D4ED8;--nav:#111827;--nav-active:#1F2937;--nav-text:#D1D5DB;--chip:#F3F4F6;--chip-text:#374151;--shadow:0 10px 30px rgba(17,24,39,.18)}
[data-theme=dark]{--card-shadow:0 1px 2px rgba(0,0,0,.3);--bg:#0B0F17;--surface:#151B26;--surface2:#111722;--border:#263041;--divider:#1F2733;--text:#F3F4F6;--text2:#D1D5DB;--muted:#9CA3AF;--input:#374151;--accent:#3B82F6;--accent-weak:#172338;--accent-border:#1E3A8A;--danger:#F87171;--warn:#FB923C;--ok:#4ADE80;--link:#93C5FD;--nav:#070A10;--nav-active:#1A2230;--nav-text:#CBD5E1;--chip:#263041;--chip-text:#E5E7EB;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 230px;max-width:100%;background:var(--nav);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;padding:4px 10px 18px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--nav-text);font-weight:500;min-height:42px}
.side a:hover{text-decoration:none;background:var(--nav-active)}
.side a.on{background:var(--nav-active);color:#fff;font-weight:600}
.side hr{border:0;height:1px;background:#374151;margin:12px 10px}
.side .count{margin-left:auto;font-size:12px;color:#9CA3AF}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface)}
.top{gap:12px;justify-content:space-between;position:relative;z-index:20}
.top-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.demo-badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 9px;opacity:.85}
.menu-wrap{position:relative}
.switcher,.account{display:flex;align-items:center;gap:10px;min-height:46px;padding:5px 12px 5px 6px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;max-width:360px}
.switcher:hover,.account:hover{border-color:var(--input);background:var(--surface2)}
.switcher[aria-expanded=true],.account[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.switcher-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.switcher-text b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-text .small{font-size:11px}
.co-badge{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:7px;background:var(--accent-weak);color:var(--link);font-size:11px;font-weight:700;letter-spacing:.03em;border:1px solid var(--accent-border);flex:none}
.co-badge.lg{min-width:36px;height:34px;border-radius:9px}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface2);border-color:var(--input)}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:300px;max-width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;display:flex;flex-direction:column}
.menu.right{left:auto;right:0}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;color:var(--text)}
.menu-item:hover{background:var(--surface2);text-decoration:none}
.menu-item.on{background:var(--accent-weak)}
.menu-item .grow,.menu-head .grow{flex:1;display:flex;flex-direction:column;min-width:0}
.menu-item .check{color:var(--accent);font-weight:700}
.menu-ico{width:26px;text-align:center;font-weight:700;color:var(--muted)}
.menu-sep{height:1px;background:var(--divider);margin:6px 4px}
.menu-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px 2px}
.menu-head{display:flex;gap:12px;align-items:center;padding:10px}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}h2{margin:0;font-size:16px}h3{margin:0;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px}.kpi .n{font-size:30px;font-weight:700}.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--input);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn.dashed{border-style:dashed;border-color:var(--accent);background:var(--accent-weak);color:var(--link)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{height:40px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--surface);min-width:0}
textarea{height:auto;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--divider);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-text);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.tabs button{min-height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:13px;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tabs .c{color:var(--muted);font-weight:500;margin-left:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--chip)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.alert-list div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--divider)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.step{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.pick{text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pick.on{border:2px solid var(--accent);background:var(--accent-weak);padding:11px 13px}
.pill{min-height:38px;padding:0 14px;border:1px solid var(--input);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:500}
.notice{padding:11px 14px;border-radius:10px;font-size:13px;background:var(--accent-weak);border:1px solid var(--accent-border)}
.warnbox{padding:11px 14px;border-radius:10px;font-size:13px;background:rgba(185,28,28,.08);color:var(--danger);border:1px solid rgba(185,28,28,.25)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:60;font-weight:500;max-width:90vw}
.toast.err{background:#7F1D1D}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.content{max-width:1440px;width:100%;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.card{border-radius:14px;box-shadow:var(--card-shadow)}
.btn{border-radius:9px;transition:background .12s,border-color .12s,box-shadow .12s}
.btn.primary{box-shadow:0 1px 2px rgba(37,99,235,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{filter:brightness(1.06)}
.top{position:sticky;top:0;backdrop-filter:saturate(1.4) blur(8px);background:color-mix(in srgb,var(--surface) 88%,transparent)}
.side{gap:1px;padding:20px 12px}
.side .nav-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;padding:14px 12px 6px}
.side a{position:relative;font-size:14px}
.side a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side a svg{opacity:.85}
th{background:var(--surface2);border-bottom:1px solid var(--border)}
thead th:first-child{border-top-left-radius:8px}thead th:last-child{border-top-right-radius:8px}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td[colspan]{border-top:1px solid var(--border)}
.chip.status{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.chip.status .dot{background:var(--c)}
.chip.todo{background:rgba(217,119,6,.14);color:#B45309}
:root[data-theme=dark] .chip.todo{color:#FBBF24}
.todobox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:10px;font-size:13px;background:rgba(217,119,6,.08);color:#B45309;border:1px solid rgba(217,119,6,.3)}
:root[data-theme=dark] .todobox{color:#FBBF24}
.kpi{position:relative}
.kpi-ico{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.co-usage{display:flex;flex-direction:column;gap:6px}
.co-row{display:grid;grid-template-columns:minmax(180px,260px) 1fr 44px;align-items:center;gap:14px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;text-align:left;color:var(--text)}
.co-row:hover{background:var(--surface2)}
.co-row.on{background:var(--accent-weak);border-color:var(--accent-border)}
.co-name{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.co-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-bar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;display:block}
.co-bar>span{display:flex;gap:2px;height:100%}
.co-bar i{display:block;height:100%}
.co-total{text-align:right;font-size:16px}
.tabs{border-radius:11px}
.pick{transition:border-color .12s,background .12s}.pick:hover{border-color:var(--input)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;gap:1px}
[data-theme=dark] .side{background:#0F1218}
.side a.wordmark{display:block;padding:4px 10px 20px;font-size:20px;font-weight:700;letter-spacing:-.035em;color:var(--text);min-height:0;gap:0}
.side a.wordmark span{color:var(--muted);font-weight:500}
.side a.wordmark:hover{background:none;text-decoration:none}
@media (min-width:701px){.side{position:sticky;top:0;height:100vh;overflow-y:auto;align-self:flex-start;flex:0 0 240px}}
.side a:not(.wordmark){color:var(--text2);font-weight:500;font-size:14px;min-height:38px;padding:8px 10px;border-radius:7px;gap:11px}
.side a:not(.wordmark) svg{color:var(--muted);opacity:1;width:17px;height:17px;stroke-width:1.75}
.side a:not(.wordmark):hover{background:var(--surface2);color:var(--text)}
.side a.on{background:var(--chip)!important;color:var(--text)!important;font-weight:600}
.side a.on svg{color:var(--text)}
.side a.on::before{display:none}
.side .count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--divider);margin:8px 10px}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px}
.side-foot{padding:6px 10px 8px;border-top:1px solid var(--border);padding-top:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media (max-width:700px){.side-foot,.side a.wordmark,.nav-sep{display:none}.side{border-right:0;border-bottom:1px solid var(--border)}.co-row{grid-template-columns:1fr 44px}.co-bar{grid-column:1/-1;order:3}.demo-badge{display:none}.account .switcher-text{display:none}.switcher{max-width:none;flex:1}.menu{min-width:0;width:calc(100vw - 28px)}.menu.right{right:-50px}.content{padding:18px 14px 40px}.top{padding:12px 14px}.side{flex-direction:row;overflow-x:auto;padding:8px 10px;gap:4px}.side .brand,.side hr,.side .count{display:none}.side a{flex:none;min-height:40px}.top .demo{width:100%}}
</style>
</head>

<div id="app"></div>
<script>
(() => {
const KEY = 'inventario-it-demo-v2';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);

const fmtDT = d => { if (!d) return '—'; const x = new Date(d); return x.toLocaleDateString('pt-PT') + ' ' + x.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }); };
const money = v => v == null || v === '' ? '—' : Number(v).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
const icons = {

const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]}</svg>`;

const KINDS = { device: 'Assets', phone: 'Assets', printer: 'Impressoras', server: 'Servidores e NAS', nas: 'Servidores e NAS', line: 'Linhas móveis' };

function seed() {

      { id: 5, name: 'Abatido', type: 'archived', color: '#6B7280' }
    ],
    categories: [
      { id: 1, name: 'Portátil', kind: 'device' }, { id: 2, name: 'Desktop', kind: 'device' }, { id: 3, name: 'Monitor', kind: 'device' },
      { id: 4, name: 'Telemóvel', kind: 'phone' }, { id: 5, name: 'Impressora', kind: 'printer' }, { id: 6, name: 'Servidor', kind: 'server' },
      { id: 7, name: 'NAS', kind: 'nas' }, { id: 8, name: 'Linha móvel', kind: 'line' }
    ],
    manufacturers: ['Lenovo', 'Dell', 'HP', 'Apple', 'Samsung', 'OPPO', 'Motorola', 'Synology', 'QNAP', 'HPE', 'Operadora Móvel'].map((name, i) => ({ id: i + 1, name })),
    models: [], locations: [], users: [], assets: [], accessories: [], accCheckouts: [], logs: []
  };
  const mf = n => d.manufacturers.find(m => m.name === n).id;

    <div class="bar" role="img" aria-label="Atribuídos ${assigned}, prontos ${ready}, pendentes ${pending}, avariados ${broken}">${seg(assigned, 'var(--accent)')}${seg(ready, '#16A34A')}${seg(pending, '#EA580C')}${seg(broken, '#B91C1C')}</div>
    <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Atribuídos <b>${assigned}</b></span><span><i class="dot" style="background:#16A34A"></i>Prontos <b>${ready}</b></span><span><i class="dot" style="background:#EA580C"></i>Em preparação/reparação <b>${pending}</b></span><span><i class="dot" style="background:#B91C1C"></i>Avariados <b>${broken}</b></span></div>
  </section>
  ${companyUsageCard()}
  <div class="grid3">
    <section class="card alert-list"><div style="border:0;padding-top:0"><h2>Devoluções em atraso</h2><span class="chip">${overdue.length}</span></div>
      ${overdue.map(a => `<div><span><a data-act="open-asset" data-id="${a.id}">${esc(a.tag)}</a> · ${esc(modelLabel(a.model))}<br><span class="small muted">${esc(targetName(a.assigned))}</span></span><span style="color:var(--danger);font-weight:600;white-space:nowrap">${Math.round((new Date(today()) - new Date(a.expected)) / 864e5)} dias</span></div>`).join('') || '<div class="muted">Nada em atraso.</div>'}</section>
    <section class="card alert-list"><div style="border:0;padding-top:0"><h2>Stock baixo de acessórios</h2><span class="chip">${low.length}</span></div>
      ${low.map(x => `<div><span>${esc(x.name)}</span><span class="small muted">${accAvail(x)} disp. / mín. ${x.min}</span></div>`).join('') || '<div class="muted">Stock em ordem.</div>'}</section>
    <section class="card alert-list"><div style="border:0;padding-top:0"><h2>Garantias a terminar (30 dias)</h2><span class="chip">${warr.length}</span></div>
      ${warr.map(a => `<div><span><a data-act="open-asset" data-id="${a.id}">${esc(a.tag)}</a> · ${esc(modelLabel(a.model))}</span><span class="small muted">${fmt(warrantyEnd(a))}</span></div>`).join('') || '<div class="muted">Nenhuma garantia a terminar.</div>'}</section>
  </div>
  <section class="card"><div class="row between"><h2>Atividade recente</h2><a href="#historico">Histórico completo</a></div>${logTable(logs)}</section>`;
}

function companyUsageCard() {
  const list = db.companies.filter(c => myCompanies().includes(c.id)).map(c => {
    const as = db.assets.filter(a => !a.deleted && a.company === c.id && status(a.status).type !== 'archived');
    const k = kinds => as.filter(a => kinds.includes(kindOf(a))).length;
    const row = { c, assets: k(['device', 'phone']), printers: k(['printer']), servers: k(['server', 'nas']), lines: k(['line']) };
    row.total = row.assets + row.printers + row.servers + row.lines;
    return row;
  }).sort((a, b) => b.total - a.total);
  const max = Math.max(1, ...list.map(r => r.total));
  const parts = [['assets', 'var(--accent)', 'Assets'], ['printers', '#8B5CF6', 'Impressoras'], ['servers', '#14B8A6', 'Servidores/NAS'], ['lines', '#F97316', 'Linhas']];
  return `<section class="card" aria-label="Por empresa" style="display:flex;flex-direction:column;gap:14px">
    <div class="row between"><h2>Por empresa</h2><div class="legend">${parts.map(([, c, l]) => `<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')}</div></div>
    <div class="co-usage">${list.map(r => `<button class="co-row ${db.ui.company === r.c.id ? 'on' : ''}" data-act="set-company" data-id="${db.ui.company === r.c.id ? 'all' : r.c.id}" title="${esc(parts.map(([k, , l]) => `${l}: ${r[k]}`).join(' · '))}">
      <span class="co-name"><span class="co-badge">${esc(r.c.code)}</span><span>${esc(r.c.name)}</span></span>
      <span class="co-bar"><span style="width:${r.total ? Math.max(3, r.total / max * 100) : 0}%">${parts.map(([k, c]) => r[k] ? `<i style="flex:${r[k]} 1 0;background:${c}"></i>` : '').join('')}</span></span>
      <b class="co-total">${r.total}</b></button>`).join('')}</div>
  </section>`;
}

function visibleLogs() {
  return db.logs.filter(l => { const c = logCompany(l); return c == null ? isAdmin() || db.ui.company === 'all' : inScope(c); }).sort((a, b) => b.at.localeCompare(a.at));
}
function logCompany(l) { if (l.itemType === 'asset') return asset(l.itemId)?.company; if (l.itemType === 'accessory') return db.accessories.find(x => x.id === l.itemId)?.company; if (l.itemType === 'user') return user(l.itemId)?.company; return null; }
const ACTIONS = { create: ['Criado', ''], update: ['Editado', ''], checkout: ['Check-out', 'blue'], 'checkin from': ['Check-in', 'green'], transfer: ['Mudou de empresa', 'orange'], delete: ['Apagado', 'red'], 'view encrypted': ['Viu PIN/PUK', 'orange'] };
function logTable(logs) {
  if (!logs.length) return '<div class="empty">Ainda sem atividade.</div>';
  const colors = { blue: 'var(--accent)', green: '#16A34A', orange: '#EA580C', red: '#B91C1C', '': 'var(--muted)' };
  const item = l => { if (l.itemType === 'asset') { const a = asset(l.itemId); return a ? `<a data-act="open-asset" data-id="${a.id}">${esc(a.tag)}</a> · ${esc(a.name || modelLabel(a.model))}` : '—'; } if (l.itemType === 'accessory') return esc(db.accessories.find(x => x.id === l.itemId)?.name); if (l.itemType === 'user') return esc(uname(user(l.itemId))); if (l.itemType === 'manufacturer') return 'Marca ' + esc(maker(l.itemId)?.name); if (l.itemType === 'company') return 'Empresa ' + esc(company(l.itemId)?.name || l.note); return '—'; };
  return `<div class="tablebox"><table style="min-width:680px"><thead><tr><th>Quando</th><th>Ação</th><th>Item</th><th>Destino</th><th>Por</th><th>Nota</th></tr></thead><tbody>
  ${logs.map(l => { const [lab, col] = ACTIONS[l.action] || [l.action, '']; return `<tr><td class="muted" style="white-space:nowrap">${fmtDT(l.at)}</td><td><span class="chip"><span class="dot" style="background:${colors[col]}"></span>${esc(lab)}${l.qty > 1 ? ' ×' + l.qty : ''}</span></td><td>${item(l)}</td><td>${l.targetType ? esc(targetName({ type: l.targetType, id: l.targetId })) : (l.from || l.to ? esc(`${l.from} → ${l.to}`) : '—')}</td><td class="muted">${esc(uname(user(l.by)))}</td><td class="muted">${esc(l.note)}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function searchBox(page, placeholder) {
  return `<label class="sr" for="q-${page}">Pesquisar</label><input id="q-${page}" type="search" data-input="q" data-page="${page}" value="${esc(st.q[page] || '')}" placeholder="${esc(placeholder)}" style="width:280px;max-width:100%">`;
}
function matches(page, ...fields) { const q = (st.q[page] || '').trim().toLowerCase(); return !q || fields.some(f => String(f ?? '').toLowerCase().includes(q)); }
function tabs(page, defs) {
  const cur = st.filter[page] || defs[0][0];
  return `<div class="tabs" role="group" aria-label="Filtrar">${defs.map(([id, label, n]) => `<button data-act="tab" data-page="${page}" data-id="${id}" class="${cur === id ? 'on' : ''}" aria-pressed="${cur === id}">${label}<span class="c">${n}</span></button>`).join('')}</div>`;
}

const allMine = () => db.assets.filter(a => !a.deleted && myCompanies().includes(a.company));
function companyBar(items, key = x => x.company) {
  const btn = (id, label, n) => { const on = db.ui.company === id; return `<button class="btn sm ${on ? 'primary' : ''}" data-act="set-company" data-id="${id}" aria-pressed="${on}">${esc(label)} · ${n}</button>`; };
  return `<div class="row" role="group" aria-label="Empresa"><span class="small muted">Empresa:</span>${btn('all', 'Todas', items.length)}${db.companies.filter(c => myCompanies().includes(c.id)).map(c => btn(c.id, c.name, items.filter(x => key(x) === c.id).length)).join('')}</div>`;
}
function grouped(rows, headers, rowFn, minWidth, summary = list => `${list.length} registo${list.length === 1 ? '' : 's'}`, key = x => x.company) {
  const groups = db.companies.filter(c => rows.some(r => key(r) === c.id)).map(c => [c, rows.filter(r => key(r) === c.id)]);
  const none = rows.filter(r => key(r) == null);
  if (none.length) groups.push([{ name: 'Sem empresa', code: '—' }, none]);
  if (!groups.length) return '<div class="empty">Nada encontrado.</div>';
  return `<div class="tablebox"><table style="min-width:${minWidth}px"><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
  ${groups.map(([c, list]) => `<tbody><tr><td colspan="${headers.length}" style="background:var(--surface2);font-weight:700;padding:10px 12px">${esc(c.name)} <span class="chip" style="margin-left:6px">${esc(c.code)}</span> <span class="muted small" style="margin-left:6px">${summary(list)}</span></td></tr>${list.map(rowFn).join('')}</tbody>`).join('')}</table></div>`;
}
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function pageAssets() {
  const kinds = a => ['device', 'phone'].includes(kindOf(a));
  const base = visibleAssets().filter(kinds);
  const F = { all: a => status(a.status).type !== 'archived', rtd: a => !isAssigned(a) && status(a.status).type === 'deployable', deployed: isAssigned, pending: a => !isAssigned(a) && status(a.status).type === 'pending', broken: a => status(a.status).type === 'undeployable', archived: a => status(a.status).type === 'archived', todo: a => status(a.status).type !== 'archived' && missing(a).length > 0 };
  const cur = st.filter.assets || 'all';
  const rows = base.filter(F[cur]).filter(a => matches('assets', a.tag, a.name, a.serial, modelLabel(a.model), cat(model(a.model).category).name, targetName(a.assigned), a.notes, company(a.company).name));
  return `<div class="row between"><div><h1>Assets</h1><div class="muted">Portáteis, desktops, monitores e telemóveis, por empresa</div></div>${canWrite() ? '<a class="btn primary" href="#novo-asset">+ Novo asset</a>' : ''}</div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row between">${tabs('assets', [['all', 'Todos', base.filter(F.all).length], ['rtd', 'Prontos', base.filter(F.rtd).length], ['deployed', 'Atribuídos', base.filter(F.deployed).length], ['pending', 'Preparação/reparação', base.filter(F.pending).length], ['broken', 'Avariados', base.filter(F.broken).length], ['archived', 'Arquivados', base.filter(F.archived).length], ...(base.some(F.todo) ? [['todo', '⚠ Por completar', base.filter(F.todo).length]] : [])])}${searchBox('assets', 'Tag, S/N, modelo, pessoa…')}</div>
    ${companyBar(allMine().filter(kinds).filter(F[cur]))}
    ${grouped(rows, ['Tag', 'Modelo', 'Categoria', 'S/N / IMEI', 'Estado', 'Atribuído a', 'Localização'], a => `<tr class="click" data-act="open-asset" data-id="${a.id}"><td><a class="mono" style="font-weight:600">${esc(a.tag)}</a>${todoChip(a)}${a.name ? `<div class="small muted">${esc(a.name)}</div>` : ''}</td><td>${esc(modelLabel(a.model))}</td><td>${esc(cat(model(a.model).category).name)}</td><td class="mono">${esc(a.serial || '—')}</td><td>${statusChip(a)}</td><td>${esc(targetName(a.assigned))}</td><td>${esc(loc(a.location)?.name || '—')}</td></tr>`, 900, l => `${plural(l.length, 'asset', 'assets')} · ${plural(l.filter(isAssigned).length, 'atribuído', 'atribuídos')}`)}
  </section>`;
}

function pageImpressoras() {
  const kinds = a => kindOf(a) === 'printer';
  const rows = visibleAssets().filter(kinds).filter(a => matches('impressoras', a.tag, a.custom.hostname, a.custom.ip, modelLabel(a.model), targetName(a.assigned), company(a.company).name));

  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${companyBar(allMine().filter(kinds))}${searchBox('impressoras', 'Nome, IP, modelo…')}</div>
  ${grouped(rows, ['Nome', 'Modelo', 'IP', 'Tipo', 'Localização', 'Estado'], a => `<tr class="click" data-act="open-asset" data-id="${a.id}"><td><a class="mono" style="font-weight:600">${esc(a.custom.hostname || a.tag)}</a>${todoChip(a)}<div class="small muted">${esc(a.tag)}</div></td><td>${esc(modelLabel(a.model))}</td><td class="mono">${esc(a.custom.ip || '—')}</td><td>${esc([a.custom.tecnologia, a.custom.cor, a.custom.multifuncoes === 'Sim' ? 'Multifunções' : ''].filter(Boolean).join(' · ') || '—')}</td><td>${esc(targetName(a.assigned) !== '—' ? targetName(a.assigned) : loc(a.location)?.name || '—')}</td><td>${statusChip(a)}</td></tr>`, 820, l => plural(l.length, 'impressora', 'impressoras'))}</section>`;
}

function pageServidores() {
  const kinds = a => ['server', 'nas'].includes(kindOf(a));
  const base = visibleAssets().filter(kinds);
  const cur = st.filter.servidores || 'all';
  const byType = a => cur === 'all' || kindOf(a) === cur;
  const rows = base.filter(byType).filter(a => matches('servidores', a.name, a.custom.hostname, a.custom.ip, modelLabel(a.model), company(a.company).name));
  return `<div class="row between"><div><h1>Servidores e NAS</h1><div class="muted">Nome, tipo, modelo, IP e localização, por empresa</div></div>${canWrite() ? '<button class="btn primary" data-act="new-kind" data-kind="server">+ Registar servidor ou NAS</button>' : ''}</div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${tabs('servidores', [['all', 'Todos', base.length], ['server', 'Servidores', base.filter(a => kindOf(a) === 'server').length], ['nas', 'NAS', base.filter(a => kindOf(a) === 'nas').length]])}${searchBox('servidores', 'Nome ou IP…')}</div>
  ${companyBar(allMine().filter(kinds).filter(byType))}
  ${grouped(rows, ['Nome', 'Tipo', 'Modelo', 'IP', 'Localização'], a => `<tr class="click" data-act="open-asset" data-id="${a.id}"><td><a class="mono" style="font-weight:600">${esc(a.custom.hostname || a.name || a.tag)}</a>${todoChip(a)}</td><td><span class="chip">${kindOf(a) === 'nas' ? 'NAS' : 'Servidor'}</span></td><td>${esc(modelLabel(a.model))}</td><td class="mono">${esc(a.custom.ip || '—')}</td><td>${esc(loc(a.location)?.name || '—')}</td></tr>`, 700, l => `${plural(l.filter(a => kindOf(a) === 'server').length, 'servidor', 'servidores')} · ${l.filter(a => kindOf(a) === 'nas').length} NAS`)}</section>`;
}

function pinCell(a) {
  if (!a.custom.pin && !a.custom.puk) return '<span class="muted">—</span>';
  const open = st.revealed[a.id];
  const txt = open ? `${a.custom.pin || '—'} / ${a.custom.puk || '—'}` : '•••• / ••••••••';
  return `<span class="row" style="gap:8px;flex-wrap:nowrap"><span class="mono">${esc(txt)}</span>${me().role !== 'leitura' ? `<button class="btn sm" data-act="reveal" data-id="${a.id}" aria-label="${open ? 'Esconder' : 'Mostrar'} PIN e PUK">${open ? 'Esconder' : 'Mostrar'}</button>` : ''}</span>`;
}

function pageLinhas() {
  const kinds = a => kindOf(a) === 'line';
  const base = visibleAssets().filter(kinds);
  const F = { all: () => true, max: a => a.custom.tarifario === 'Biz Max', std: a => a.custom.tarifario === 'Biz Standard', free: a => !a.assigned, nodev: a => !phoneOfLine(a) };
  const cur = st.filter.linhas || 'all';
  const rows = base.filter(F[cur]).filter(a => matches('linhas', a.custom.numero, a.name, uname(ownerOfLine(a)), phoneOfLine(a)?.serial, phoneOfLine(a) && modelLabel(phoneOfLine(a).model), company(a.company).name));
  const lineRow = a => { const p = phoneOfLine(a), o = ownerOfLine(a); return `<tr><td><span class="chip">${esc(a.custom.tarifario || '—')}</span></td><td style="white-space:nowrap"><a class="mono" style="font-weight:600" data-act="open-asset" data-id="${a.id}">${esc(a.name)}</a></td><td>${o ? esc(uname(o)) : '<i class="muted">Livre</i>'}</td><td style="white-space:nowrap">${pinCell(a)}</td><td>${p ? `<a data-act="open-asset" data-id="${p.id}">${esc(modelLabel(p.model))}</a>` : '<span class="muted">—</span>'}</td><td class="mono">${esc(p?.serial || '—')}</td><td>${fmt(a.custom.ativacao)}</td><td class="muted">${esc([a.custom.acessorios, a.custom.portado ? 'Portada: ' + a.custom.portado : ''].filter(Boolean).join(' · ') || '—')}</td></tr>`; };
  return `<div class="row between"><div><h1>Linhas móveis</h1><div class="muted">${plural(base.length, 'linha', 'linhas')} · ${plural(base.filter(F.free).length, 'livre', 'livres')} · ${base.filter(F.nodev).length} sem telemóvel · por empresa</div></div>${canWrite() ? '<button class="btn primary" data-act="new-kind" data-kind="line">+ Nova linha</button>' : ''}</div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${tabs('linhas', [['all', 'Todas', base.length], ['max', 'Biz Max', base.filter(F.max).length], ['std', 'Biz Standard', base.filter(F.std).length], ['free', 'Livres', base.filter(F.free).length], ['nodev', 'Sem telemóvel', base.filter(F.nodev).length]])}${searchBox('linhas', 'Número, nome ou IMEI…')}</div>
  ${companyBar(allMine().filter(kinds).filter(F[cur]))}
  ${grouped(rows, ['Tarifário', 'Nº telefone', 'Nome', 'PIN / PUK', 'Telemóvel', 'IMEI', 'Ativação', 'Acessórios / notas'], lineRow, 1050, l => `${plural(l.length, 'linha', 'linhas')} · ${plural(l.filter(a => !a.assigned).length, 'livre', 'livres')}`)}
  <p class="small muted" style="margin:0">O PIN/PUK está cifrado. Cada vez que alguém carrega em "Mostrar", fica registado no histórico.</p></section>`;
}

const accOpen = x => db.accCheckouts.filter(c => c.acc === x.id && !c.inAt);
const accAvail = x => x.qty - accOpen(x).length;
function pageAcessorios() {
  const rows = db.accessories.filter(x => inScope(x.company)).filter(x => matches('acessorios', x.name, x.category, company(x.company).name));
  return `<div class="row between"><div><h1>Acessórios</h1><div class="muted">Artigos em quantidade, sem n.º de série, por empresa</div></div>${canWrite() ? '<button class="btn primary" data-act="new-acc">+ Novo acessório</button>' : ''}</div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${companyBar(db.accessories.filter(x => myCompanies().includes(x.company)))}${searchBox('acessorios', 'Nome ou categoria…')}</div>
  ${grouped(rows, ['Nome', 'Categoria', 'Total', 'Disponíveis', 'Mínimo', ''], x => { const av = accAvail(x); return `<tr><td style="font-weight:600">${esc(x.name)}</td><td>${esc(x.category)}</td><td>${x.qty}</td><td style="color:${av < x.min ? 'var(--danger)' : 'inherit'};font-weight:600">${av}</td><td>${x.min}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-act="acc-list" data-id="${x.id}">Entregues (${accOpen(x).length})</button> ${canWrite() ? `<button class="btn sm primary" data-act="acc-out" data-id="${x.id}" ${av ? '' : 'disabled'}>Entregar</button>` : ''}</td></tr>`; }, 720, l => `${plural(l.length, 'acessório', 'acessórios')} · ${l.filter(x => accAvail(x) < x.min).length} com stock baixo`)}</section>`;
}

function userItems(u) { return { assets: db.assets.filter(a => !a.deleted && a.assigned?.type === 'user' && a.assigned.id === u.id), acc: db.accCheckouts.filter(c => c.user === u.id && !c.inAt) }; }
function pageUtilizadores() {

  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${tabs('utilizadores', [['all', 'Todos', base.length], ['login', 'Com login', base.filter(F.login).length], ['admin', 'Pode mexer', base.filter(F.admin).length], ['nologin', 'Sem login', base.filter(F.nologin).length]])}${searchBox('utilizadores', 'Nome, e-mail, empresa…')}</div>
  ${companyBar(db.users.filter(u => u.company && myCompanies().includes(u.company)).filter(F[cur]))}

}

const TOKEN_EXPIRY = { 30: '30 dias', 90: '90 dias', 365: '1 ano', never: 'Sem fim' };
function pageTokens() {

    const existing = db.accessories.find(x => norm(x.name) === norm(rec.name) && x.company === cid);

    let first = rec.first, last = rec.last; if (!first && rec.full) { const p = rec.full.trim().split(/\s+/); first = p[0]; last = p.slice(1).join(' '); }

    if (rec.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(rec.email)) err(`E-mail "${rec.email}" inválido.`);
    const existing = rec.email ? db.users.find(u => u.email && u.email.toLowerCase() === rec.email.toLowerCase()) : db.users.find(u => norm(uname(u)) === norm(`${first} ${last || ''}`));
    if (existing) { outcome = 'update'; warn('Já existe: vai ser atualizado.'); }
    summary = [`${first || ''} ${last || ''}`.trim(), rec.email, comp?.code].filter(Boolean).join(' · ');
    apply = batch => { if (existing) { batch.updatedUsers.push({ ...existing }); Object.assign(existing, { first, last: last || existing.last, email: rec.email || existing.email, company: cid ?? existing.company }); log('update', 'user', existing.id, null, 'Importação'); } else { const u = { id: nextId(), first, last: last || '', email: rec.email || '', company: cid, active: true }; db.users.push(u); batch.created.users.push(u.id); log('create', 'user', u.id, null, 'Importação'); } };
  }

  if (newCompany && apply) { const inner = apply; apply = batch => { cid = ensureCompany(batch, newCompany).id; inner(batch); }; }
  else if (outcome === 'new' && msgs.some(m => m[0] === 'warn')) outcome = 'warn';
  return { status: outcome, summary, msgs, apply };
}

function undoImport(id) {
  const b = (db.imports || []).find(x => x.id === id); if (!b || b.undone) return;
  const del = new Set(b.created.assets);
  db.assets = db.assets.filter(a => !del.has(a.id));
  b.updated.forEach(old => { const i = db.assets.findIndex(a => a.id === old.id); if (i >= 0) db.assets[i] = old; });
  db.assets.forEach(a => { if (a.assigned?.type === 'asset' && del.has(a.assigned.id)) a.assigned = null; });
  db.accessories = db.accessories.filter(x => !b.created.accessories.includes(x.id));
  b.updatedAcc.forEach(old => { const i = db.accessories.findIndex(x => x.id === old.id); if (i >= 0) db.accessories[i] = old; });
  const usedUsers = new Set(db.assets.filter(a => a.assigned?.type === 'user').map(a => a.assigned.id));
  db.users = db.users.filter(u => !b.created.users.includes(u.id) || usedUsers.has(u.id));
  b.updatedUsers.forEach(old => { const i = db.users.findIndex(u => u.id === old.id); if (i >= 0) db.users[i] = old; });
  const usedModels = new Set(db.assets.map(a => a.model));
  db.models = db.models.filter(m => !b.created.models.includes(m.id) || usedModels.has(m.id));
  db.manufacturers = db.manufacturers.filter(m => !b.created.manufacturers.includes(m.id) || db.models.some(x => x.manufacturer === m.id));
  db.locations = db.locations.filter(l => !b.created.locations.includes(l.id) || db.assets.some(a => a.location === l.id));
  db.categories = db.categories.filter(c => !(b.created.categories || []).includes(c.id) || db.models.some(m => m.category === c.id));
  db.companies = db.companies.filter(c => !(b.created.companies || []).includes(c.id) || companyUsage(c.id));
  b.undone = true; log('update', 'import', b.id, null, `Importação de ${IO[b.module].label} anulada`);
}

function pageAssetDetail(a) {
  const k = kindOf(a), back = PAGE_OF_KIND[k], defs = FIELD_DEFS[k] || [];
  const children = db.assets.filter(x => !x.deleted && x.assigned?.type === 'asset' && x.assigned.id === a.id);
  const logs = db.logs.filter(l => l.itemType === 'asset' && l.itemId === a.id).sort((x, y) => y.at.localeCompare(x.at));
  const w = warrantyEnd(a);
  return `<div><a href="#${back}" data-act="close-detail" data-page="${back}">← ${esc(NAV.find(n => n[0] === back)[1])}</a></div>
  <div class="row between"><div><div class="row"><h1 class="mono" style="font-size:22px">${esc(a.tag)}</h1>${statusChip(a)}${companyChip(a.company)}</div><div class="muted" style="margin-top:4px">${esc(a.name ? a.name + ' · ' : '')}${esc(modelLabel(a.model))} · ${esc(cat(model(a.model).category).name)}</div></div>
  ${canWrite() && !a.deleted ? `<div class="row">${isAssigned(a) ? `<button class="btn primary" data-act="checkin" data-id="${a.id}">Check-in</button>` : `<button class="btn primary" data-act="checkout" data-id="${a.id}">Check-out</button>`}<button class="btn" data-act="edit-asset" data-id="${a.id}">Editar</button><button class="btn" data-act="status" data-id="${a.id}">Mudar estado</button><button class="btn" data-act="transfer" data-id="${a.id}">Mudar de empresa</button>${isAdmin() ? `<button class="btn danger" data-act="delete" data-id="${a.id}">Apagar</button>` : ''}</div>` : ''}</div>
  ${a.deleted ? '<div class="warnbox">Este asset foi apagado. O histórico mantém-se.</div>' : ''}
  ${!a.deleted && missing(a).length ? `<div class="todobox"><span>⚠ <b>Por completar.</b> Falta: ${esc(missing(a).join(', '))}.</span>${canWrite() ? `<button class="btn sm" data-act="edit-asset" data-id="${a.id}">Completar agora</button>` : ''}</div>` : ''}
  <div class="grid3">
    <section class="card"><h2 style="margin-bottom:12px">Detalhes</h2><dl class="kv">
      <dt>Atribuído a</dt><dd>${a.assigned ? `${esc(targetName(a.assigned))} <span class="small muted">(${a.assigned.type === 'user' ? 'pessoa' : a.assigned.type === 'location' ? 'localização' : 'asset'})</span>` : '—'}</dd>
      <dt>${k === 'phone' ? 'IMEI' : 'N.º de série'}</dt><dd class="mono">${esc(a.serial || '—')}</dd>
      <dt>Localização</dt><dd>${esc(loc(a.location)?.name || '—')}</dd>
      <dt>Devolução prevista</dt><dd style="color:${a.expected && a.expected < today() && a.assigned ? 'var(--danger)' : 'inherit'}">${fmt(a.expected)}</dd>
      <dt>Compra</dt><dd>${fmt(a.purchaseDate)} · ${money(a.cost)}</dd>
      <dt>Garantia</dt><dd>${a.warranty ? `${a.warranty} meses, até ${fmt(w)}` : '—'}</dd>
      <dt>Notas</dt><dd>${esc(a.notes || '—')}</dd>
    </dl></section>
    ${defs.length ? `<section class="card"><h2 style="margin-bottom:12px">Campos de ${esc(cat(model(a.model).category).name.toLowerCase())}</h2><dl class="kv">${defs.map(([key, label, , enc]) => `<dt>${esc(label)}${enc ? ' 🔒' : ''}</dt><dd class="${['ip', 'hostname', 'numero', 'pin', 'puk'].includes(key) ? 'mono' : ''}">${enc ? (a.custom[key] ? (st.revealed[a.id] ? esc(a.custom[key]) : '••••••••') : '—') : esc(key === 'ativacao' ? fmt(a.custom[key]) : (a.custom[key] || '—'))}</dd>`).join('')}</dl>
      ${defs.some(d => d[3]) && (a.custom.pin || a.custom.puk) && me().role !== 'leitura' ? `<div style="margin-top:12px"><button class="btn sm" data-act="reveal" data-id="${a.id}">${st.revealed[a.id] ? 'Esconder PIN/PUK' : 'Mostrar PIN/PUK'}</button></div>` : ''}</section>` : ''}
    ${children.length ? `<section class="card"><h2 style="margin-bottom:12px">Atribuído a este asset</h2>${children.map(c => `<div style="padding:8px 0;border-top:1px solid var(--divider)"><a data-act="open-asset" data-id="${c.id}" class="mono">${esc(c.name || c.tag)}</a> <span class="muted">· ${esc(cat(model(c.model).category).name)}</span></div>`).join('')}</section>` : ''}
  </div>

}

function newForm() {

  const serials = f.multi ? f.serials.split('\n').map(s => s.trim()).filter(Boolean) : (f.serial.trim() ? [f.serial.trim()] : []);

    <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row"><span class="step" style="background:${stepColor(brand, !brand)}">1</span><h2>Marca</h2></div>

      <label class="f">Escreve a marca<input id="nf-q" data-nf="q" value="${esc(f.q)}" placeholder="ex.: Lenovo, Dell, HP…" autocomplete="off"></label>
      <div class="row">${found.map(b => `<button class="pill" data-act="nf-brand" data-id="${b.id}">${esc(b.name)} <span class="muted">· ${db.models.filter(m => m.manufacturer === b.id && ['device', 'phone'].includes(cat(m.category).kind)).length} modelos</span></button>`).join('')}
      ${q.length > 1 && !brands.some(b => b.name.toLowerCase() === q) && !db.manufacturers.some(b => b.name.toLowerCase() === q) ? `<button class="pill btn dashed" data-act="nf-new-brand">+ Criar marca “${esc(f.q.trim())}”</button>` : ''}</div>`}
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px;opacity:${brand ? 1 : .55}"><div class="row between"><div class="row"><span class="step" style="background:${stepColor(mdl, brand && !mdl)}">2</span><h2>Modelo</h2></div>${brand && !f.newModel ? '<button class="btn sm dashed" data-act="nf-open-model">+ Novo modelo</button>' : ''}</div>
      ${!brand ? '<p class="muted" style="margin:0">Escolhe primeiro a marca para veres os modelos dela.</p>' : ''}
      ${models.length ? `<div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${models.map(m => `<button class="pick ${f.model === m.id ? 'on' : ''}" data-act="nf-model" data-id="${m.id}" aria-pressed="${f.model === m.id}"><b>${esc(m.name)}</b><span class="small muted">${esc(cat(m.category).name)} · ${db.assets.filter(a => a.model === m.id && !a.deleted).length} em inventário</span></button>`).join('')}</div>` : ''}
      ${brand && !models.length && !f.newModel ? '<p class="muted" style="margin:0">Esta marca ainda não tem modelos. Cria o primeiro.</p>' : ''}
      ${f.newModel ? `<div class="notice" style="display:flex;flex-direction:column;gap:12px"><b>Novo modelo de ${esc(brand.name)}</b><div class="form-grid"><label class="f">Nome do modelo<input id="nf-nm" data-nf="nmName" value="${esc(f.nmName)}" placeholder="ex.: ThinkPad E14 Gen 5"></label><label class="f">Categoria<select id="nf-nmcat" data-nf="nmCat">${db.categories.filter(c => ['device', 'phone'].includes(c.kind)).map(c => `<option value="${c.id}" ${+f.nmCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label></div><div class="row"><button class="btn primary" data-act="nf-save-model">Criar modelo e usar</button><button class="btn" data-act="nf-cancel-model">Cancelar</button></div></div>` : ''}
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:14px;opacity:${mdl ? 1 : .55}"><div class="row"><span class="step" style="background:${stepColor(false, !!mdl)}">3</span><h2>S/N e detalhes</h2></div>
      ${!mdl ? '<p class="muted" style="margin:0">Escolhe o modelo e a categoria é preenchida sozinha.</p>' : `

        <label class="f">Estado<select id="nf-status" data-nf="status">${db.statuses.filter(s => s.type !== 'archived').map(s => `<option value="${s.id}" ${+f.status === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
        <label class="f">Localização<select id="nf-loc" data-nf="location"><option value="">—</option>${locs.map(l => `<option value="${l.id}" ${+f.location === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>
      ${last ? `<label class="row notice" style="cursor:pointer;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" data-nf="copy" ${f.copy ? 'checked' : ''} style="width:18px;height:18px;margin-top:2px"><span><b>Copiar dados de compra do último ${esc(mdl.name)}</b><br><span class="small muted">${esc(last.tag)} · ${fmt(last.purchaseDate)} · ${money(last.cost)} · garantia ${esc(last.warranty || '—')} meses</span></span></label>` : ''}
      <div class="row"><button class="btn primary" data-act="nf-save" data-next="1" ${serials.length && !dups.length ? '' : 'disabled'}>${serials.length > 1 ? `Guardar ${serials.length} e criar outros` : 'Guardar e criar outro'}</button><button class="btn" data-act="nf-save" data-next="0" ${serials.length && !dups.length ? '' : 'disabled'}>Guardar e fechar</button></div>`}

    <p class="small muted" style="margin:0">Experimenta escrever um S/N que já existe, por exemplo <span class="mono">PF4X1A2B</span>.</p></aside>

function modalHTML() {
  const m = st.modal; if (!m) return '';
  const a = m.id && asset(m.id);
  const wrap = (title, body, form, submit = 'Confirmar') => `<div class="modal-bg" data-act="modal-bg"><form class="modal" data-form="${form}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between"><h2>${esc(title)}</h2><button type="button" class="btn sm" data-act="close-modal" aria-label="Fechar">✕</button></div>${m.error ? `<div class="warnbox" role="alert">${esc(m.error)}</div>` : ''}${body}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form></div>`;
  if (m.type === 'checkout') {
    const tt = m.tt || (['printer', 'server', 'nas'].includes(kindOf(a)) ? 'location' : kindOf(a) === 'line' ? 'asset' : 'user');
    const opts = tt === 'user' ? db.users.filter(u => u.active && (u.company == null || myCompanies().includes(u.company))).map(u => [u.id, `${uname(u)}${u.company ? ' · ' + company(u.company).code : ''}`])
      : tt === 'location' ? db.locations.filter(l => l.company == null || myCompanies().includes(l.company)).map(l => [l.id, l.name])
      : db.assets.filter(x => x.id !== a.id && !x.deleted && myCompanies().includes(x.company) && (kindOf(a) !== 'line' || kindOf(x) === 'phone')).map(x => [x.id, `${x.tag} · ${x.name || modelLabel(x.model)}`]);
    return wrap(`Check-out de ${a.tag}`, `<div class="tabs">${[['user', 'Pessoa'], ['location', 'Localização'], ['asset', kindOf(a) === 'line' ? 'Telemóvel' : 'Outro asset']].map(([id, l]) => `<button type="button" class="${tt === id ? 'on' : ''}" data-act="co-type" data-v="${id}">${l}</button>`).join('')}</div><input type="hidden" name="tt" value="${tt}">
      <label class="f">Destino<select name="target" required><option value="">Escolhe…</option>${opts.map(([id, l]) => `<option value="${id}">${esc(l)}</option>`).join('')}</select></label>
      <div class="form-grid"><label class="f">Devolução prevista<input type="date" name="expected"></label></div><label class="f">Nota<input name="note" placeholder="opcional; obrigatória para outra empresa"></label>`, 'checkout', 'Fazer check-out');
  }
  if (m.type === 'checkin') return wrap(`Check-in de ${a.tag}`, `<p style="margin:0" class="muted">Está com: <b>${esc(targetName(a.assigned))}</b></p><div class="form-grid"><label class="f">Volta no estado<select name="status">${db.statuses.filter(s => s.type !== 'archived').map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="f">Localização<select name="location"><option value="">Manter</option>${db.locations.filter(l => l.company == null || l.company === a.company).map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label></div><label class="f">Nota<input name="note"></label>`, 'checkin', 'Fazer check-in');
  if (m.type === 'edit-asset') {
    const md = model(a.model), mk = db.manufacturers.find(x => x.id === md?.manufacturer), k = kindOf(a), miss = missing(a);
    const cats = db.categories.filter(c => ['device', 'phone'].includes(k) ? ['device', 'phone'].includes(c.kind) : c.kind === k);
    const hl = f => miss.includes(f) ? ' style="--b:#D97706;border-color:#D97706"' : '';
    return wrap(`Editar ${a.tag}`, `<datalist id="dl-brands">${db.manufacturers.filter(x => norm(x.name) !== 'semmarca').map(x => `<option value="${esc(x.name)}">`).join('')}</datalist><datalist id="dl-models">${db.models.filter(x => !mk || x.manufacturer === mk.id).map(x => `<option value="${esc(x.name)}">`).join('')}</datalist>
      <div class="form-grid"><label class="f">Marca<input name="brand" list="dl-brands" required value="${esc(mk && norm(mk.name) !== 'semmarca' ? mk.name : '')}" placeholder="ex.: HP"${hl('marca')}></label><label class="f">Modelo<input name="model" list="dl-models" required value="${esc(miss.includes('modelo') ? '' : md?.name || '')}" placeholder="${esc(md?.name || '')}"${hl('modelo')}></label></div>
      <div class="form-grid"><label class="f">Categoria<select name="category">${cats.map(c => `<option value="${c.id}" ${c.id === md?.category ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label><label class="f">${k === 'phone' ? 'IMEI' : 'N.º de série'}<input name="serial" class="mono" value="${esc(a.serial || '')}"${hl(k === 'phone' ? 'IMEI' : 'n.º de série')}></label></div>
      <label class="f">Nome<input name="name" value="${esc(a.name || '')}" placeholder="opcional"></label><label class="f">Notas<input name="notes" value="${esc(a.notes || '')}"></label>`, 'edit-asset', 'Guardar');
  }
  if (m.type === 'status') return wrap(`Estado de ${a.tag}`, `<label class="f">Estado<select name="status">${db.statuses.map(s => `<option value="${s.id}" ${s.id === a.status ? 'selected' : ''}>${esc(s.name)} (${s.type})</option>`).join('')}</select></label><label class="f">Nota<input name="note"></label>`, 'status', 'Guardar');
  if (m.type === 'transfer') return wrap(`Mudar ${a.tag} de empresa`, `${isAssigned(a) ? '<div class="warnbox">Faz check-in antes de mudar de empresa.</div>' : ''}<label class="f">Nova empresa<select name="company">${db.companies.filter(c => c.id !== a.company && myCompanies().includes(c.id)).map(c => `<option value="${c.id}">${esc(c.name)} (${c.code})</option>`).join('')}</select></label><label class="row" style="gap:8px"><input type="checkbox" name="retag" checked style="width:18px;height:18px"> Dar uma tag nova com o prefixo da empresa de destino</label><label class="f">Nota<input name="note"></label>`, 'transfer', 'Mudar de empresa');
  if (m.type === 'delete') return wrap(`Apagar ${a.tag}?`, `<p style="margin:0">O asset deixa de aparecer nas listas, mas o histórico mantém-se.</p>${isAssigned(a) ? '<div class="warnbox">Faz check-in antes de apagar.</div>' : ''}`, 'delete', 'Apagar');
  if (m.type === 'new-kind') {
    const k = m.kind, cats = k === 'server' ? db.categories.filter(c => ['server', 'nas'].includes(c.kind)) : db.categories.filter(c => c.kind === k);
    const mdls = db.models.filter(x => cats.some(c => c.id === x.category));
    const defs = FIELD_DEFS[k === 'server' ? 'server' : k];
    const title = { printer: 'Registar impressora', server: 'Registar servidor ou NAS', line: 'Nova linha móvel' }[k];
    return wrap(title, `<div class="form-grid"><label class="f">Empresa<select name="company">${db.companies.filter(c => myCompanies().includes(c.id) && c.active !== false).map(c => `<option value="${c.id}" ${db.ui.company === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="f">Modelo<select name="model" required>${mdls.map(x => `<option value="${x.id}">${esc(modelLabel(x.id))} · ${esc(cat(x.category).name)}</option>`).join('')}</select></label>
      ${k !== 'line' ? `<label class="f">N.º de série<input name="serial" class="mono"></label>` : ''}
      ${defs.map(([key, label, opts]) => opts ? `<label class="f">${label}<select name="c_${key}">${opts.map(o => `<option>${o}</option>`).join('')}</select></label>` : `<label class="f">${label}<input name="c_${key}" ${key === 'ativacao' ? 'type="date"' : ''} class="${['ip', 'hostname', 'numero', 'pin', 'puk'].includes(key) ? 'mono' : ''}" ${key === 'numero' ? 'required inputmode="numeric" placeholder="9 dígitos"' : ''}></label>`).join('')}
      ${k !== 'line' ? `<label class="f">Localização<select name="location"><option value="">—</option>${db.locations.filter(l => l.company == null || myCompanies().includes(l.company)).map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>` : ''}</div>

function route() {

  st.page = h === 'novo-asset' ? 'novo' : h === 'tokens' ? 'tokens' : (NAV.some(n => n[0] === h) ? h : 'painel');

function checkout(a, tt, targetId, expected, note) {
  if (isAssigned(a)) return 'Este asset já está atribuído. Faz check-in primeiro.';
  if (status(a.status).type !== 'deployable') return `O estado "${status(a.status).name}" não permite check-out. Muda o estado para Pronto.`;
  if (!targetId) return 'Escolhe o destino.';
  if (tt === 'user') {
    const u = user(targetId);
    if (!u.active) return 'Este utilizador está inativo.';
    if (u.company && u.company !== a.company) { if (!isAdmin()) return 'O utilizador é de outra empresa.'; if (!note) return 'Check-out para outra empresa: tens de deixar uma nota.'; }
    a.location = u.location || a.location;
  }
  if (tt === 'asset') { let c = asset(targetId); for (let i = 0; c && i < 10; i++) { if (c.id === a.id) return 'Não se pode atribuir um asset a si próprio.'; c = c.assigned?.type === 'asset' ? asset(c.assigned.id) : null; } a.location = asset(targetId).location || a.location; }
  if (tt === 'location') a.location = targetId;
  a.assigned = { type: tt, id: targetId }; a.expected = expected || ''; a.lastCheckout = new Date().toISOString();
  log('checkout', 'asset', a.id, a.assigned, note);
  return null;
}
function checkin(a, statusId, locationId, note) {
  const from = a.assigned; a.assigned = null; a.expected = ''; if (statusId) a.status = statusId; if (locationId) a.location = locationId;
  log('checkin from', 'asset', a.id, from, note);
}

  'acc-in'(d) { const c = db.accCheckouts.find(x => x.id === +d.id); c.inAt = new Date().toISOString(); log('checkin from', 'accessory', c.acc, { type: 'user', id: c.user }); toast('Acessório recebido.'); },
  'return-all'(d) { const u = user(+d.id), it = userItems(u); it.assets.forEach(a => checkin(a, null, null, 'Devolução de tudo')); it.acc.forEach(c => { c.inAt = new Date().toISOString(); log('checkin from', 'accessory', c.acc, { type: 'user', id: u.id }, 'Devolução de tudo'); }); toast(`Devolvido${it.assets.length + it.acc.length === 1 ? '' : 's'}: ${it.assets.length} asset${it.assets.length === 1 ? '' : 's'} e ${it.acc.length} acessório${it.acc.length === 1 ? '' : 's'}.`); },
  'toggle-active'(d) { const u = user(+d.id); if (u.active && (userItems(u).assets.length || userItems(u).acc.length)) return toast('Este utilizador ainda tem equipamentos. Usa "Devolver tudo" primeiro.', true); u.active = !u.active; log('update', 'user', u.id, null, u.active ? 'Ativado' : 'Desativado'); toast(u.active ? 'Utilizador ativado.' : 'Utilizador desativado.'); },
  'nf-brand'(d) { Object.assign(newForm(), { brand: +d.id, model: null, newModel: false, msg: '' }); render(); },
  'nf-new-brand'() { const f = newForm(), name = f.q.trim(); const b = { id: nextId(), name }; db.manufacturers.push(b); Object.assign(f, { brand: b.id, model: null, newModel: true, nmName: '', msg: '' }); log('create', 'manufacturer', b.id); render(); },
  'nf-clear-brand'() { Object.assign(newForm(), { brand: null, model: null, newModel: false }); render(); },
  'nf-model'(d) { Object.assign(newForm(), { model: +d.id, newModel: false, msg: '' }); render(); $('#nf-serial, #nf-serials')?.focus(); },
  'nf-open-model'() { Object.assign(newForm(), { newModel: true, nmName: '' }); render(); },
  'nf-cancel-model'() { newForm().newModel = false; render(); },
  'nf-save-model'() { const f = newForm(); if (!f.nmName.trim()) return toast('Escreve o nome do modelo.', true); if (db.models.some(m => m.manufacturer === f.brand && m.name.toLowerCase() === f.nmName.trim().toLowerCase())) return toast('Esse modelo já existe nesta marca.', true); const m = { id: nextId(), manufacturer: f.brand, name: f.nmName.trim(), category: +f.nmCat }; db.models.push(m); Object.assign(f, { model: m.id, newModel: false }); render(); },
  'nf-multi'(d) { newForm().multi = d.v === '1'; render(); },
  'nf-save'(d) {
    const f = newForm(), mdl = model(f.model);
    const list = f.multi ? f.serials.split('\n').map(s => s.trim()).filter(Boolean) : [f.serial.trim()].filter(Boolean);
    const last = [...db.assets].reverse().find(a => a.model === mdl.id && a.purchaseDate);
    const created = list.map(serial => { const a = { id: nextId(), company: +f.company, model: mdl.id, status: +f.status, tag: nextTag(+f.company), name: '', serial, purchaseDate: '', cost: '', warranty: '', location: f.location ? +f.location : null, assigned: null, expected: '', notes: '', custom: {}, created: new Date().toISOString() }; if (f.copy && last) Object.assign(a, { purchaseDate: last.purchaseDate, cost: last.cost, warranty: last.warranty }); db.assets.push(a); log('create', 'asset', a.id); return a; });
    const msg = created.length === 1 ? `Criado ${created[0].tag} · ${modelLabel(mdl.id)} · S/N ${created[0].serial}` : `Criados ${created.length} assets (${created[0].tag} a ${created.at(-1).tag}) · ${modelLabel(mdl.id)}`;
    if (d.next === '1') { Object.assign(f, { serial: '', serials: '', msg: msg + '. Marca e modelo mantêm-se para o próximo.' }); render(); $('#nf-serial, #nf-serials')?.focus(); }
    else { st.nf = null; location.hash = 'assets'; toast(msg); }
  }
};

function companyUsage(id) { return db.assets.some(a => !a.deleted && a.company === id) || db.accessories.some(x => x.company === id) || db.users.some(u => u.company === id); }
const forms = {
  'company-form'(fd) {
    const m = st.modal, c = m.id ? company(m.id) : null, name = fd.get('name').trim(), code = fd.get('code').trim().toUpperCase(), nif = fd.get('nif').trim();
    if (!/^[A-Z0-9]{2,5}$/.test(code)) { st.modal.error = 'O código tem de ter 2 a 5 letras ou números.'; return render(); }
    if (db.companies.some(x => x.id !== c?.id && x.code === code)) { st.modal.error = `O código ${code} já está a ser usado.`; return render(); }
    if (db.companies.some(x => x.id !== c?.id && x.name.toLowerCase() === name.toLowerCase())) { st.modal.error = 'Já existe uma empresa com esse nome.'; return render(); }
    if (c) { const before = `${c.name} (${c.code})`; Object.assign(c, { name, code, nif, active: !!fd.get('active') }); log('update', 'company', c.id, null, `${before} → ${name} (${code})${c.active ? '' : ' · desativada'}`); st.modal = null; return toast('Empresa atualizada.'); }
    const n = { id: nextId(), name, code, nif, counter: 0, active: true };
    db.companies.push(n);
    const l = fd.get('location')?.trim(); if (l) db.locations.push({ id: nextId(), name: l, company: n.id });
    log('create', 'company', n.id, null, `${name} (${code})`); st.modal = null; toast(`${name} criada. As tags vão ser ${code}-00001, ${code}-00002…`);
  },
  'new-token'(fd) {
    const access = fd.get('access'), exp = fd.get('expires'), name = fd.get('name').trim();
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
    (db.tokens ||= []).push({ id: nextId(), user: me().id, name, access, created: Date.now(), expires: exp === 'never' ? null : Date.now() + +exp * 864e5 });
    st.newToken = `${db.tokens.length}|${rnd}`;
    log('create', 'user', me().id, null, `Token da API "${name}" (${access === 'write' ? 'leitura e escrita' : 'só leitura'}, ${TOKEN_EXPIRY[exp]})`); render();
  },
  forgot(fd) { st.forgot = { email: fd.get('email').trim(), sent: true }; render(); },
  'reset-password'(fd) {
    const f = st.forgot, u = user(f.token.user), pw = fd.get('password');
    if (pw.length < 8) { f.error = 'A password tem de ter pelo menos 8 caracteres.'; return render(); }
    if (pw !== fd.get('confirm')) { f.error = 'As duas passwords não são iguais.'; return render(); }
    u.password = pw; f.token.used = true; db.logs.push({ id: nextId(), at: new Date().toISOString(), action: 'update', itemType: 'user', itemId: u.id, targetType: null, targetId: null, by: u.id, note: 'Password reposta pelo próprio (link por e-mail)' });
    st.forgot = null; st.loginEmail = u.email; st.loginError = null; render(); toast('Password alterada. Já podes entrar.');
  },
  login(fd) {
    const email = fd.get('email').trim().toLowerCase(), u = db.users.find(x => x.login && x.email?.toLowerCase() === email);
    st.loginEmail = fd.get('email').trim();
    if (!u || u.password !== fd.get('password')) { st.loginError = 'E-mail ou password errados.'; return render(); }
    if (!u.active) { st.loginError = 'Este login está desativado.'; return render(); }
    if (!db.ui.sessions.includes(u.id)) db.ui.sessions.push(u.id);
    db.ui.role = u.id; st.login = false; st.loginError = null; st.loginEmail = ''; st.detail = null; st.revealed = {};
    if (db.ui.company !== 'all' && !myCompanies().includes(db.ui.company)) db.ui.company = 'all';
    location.hash = 'painel'; render(); toast(`Olá, ${u.first}. ${db.ui.sessions.length > 1 ? db.ui.sessions.length + ' sessões abertas ao mesmo tempo.' : ''}`);
  },
  'login-form'(fd) {
    const m = st.modal, u = m.id ? user(m.id) : null, email = fd.get('email').trim(), role = fd.get('role'), pw = fd.get('password');
    const comps = db.companies.map(c => c.id);
    const active = u?.login ? !!fd.get('loginActive') : true;
    const fail = msg => { st.modal.error = msg; st.modal.role = role; render(); };
    if (db.users.some(x => x.id !== u?.id && x.email?.toLowerCase() === email.toLowerCase())) return fail('Esse e-mail já está a ser usado.');
    if (pw && pw.length < 8) return fail('A password tem de ter pelo menos 8 caracteres.');
    const admins = db.users.filter(x => x.login && x.active && x.role === 'admin');
    if (u && u.role === 'admin' && (role !== 'admin' || !active) && admins.length === 1) return fail('Tem de existir pelo menos um login ativo que possa mexer.');
    if (u && u.id === me().id && (role !== 'admin' || !active)) return fail('Não podes tirar a ti próprio o "Pode mexer" nem desativar o teu login.');
    const data = { first: fd.get('first').trim(), last: fd.get('last').trim(), email, role, companies: comps, login: true, active };
    if (pw) data.password = pw;
    if (u) { const before = u.login ? ROLE_LABEL[u.role] : 'sem login'; Object.assign(u, data); if (!active) db.ui.sessions = db.ui.sessions.filter(x => x !== u.id); log('update', 'user', u.id, null, `Acesso: ${before} → ${active ? ROLE_LABEL[role] : 'desativado'}${pw ? ' · password alterada' : ''}`); }
    else { const n = { id: nextId(), ...data, company: +fd.get('company') || null }; db.users.push(n); log('create', 'user', n.id, null, `Login ${ROLE_LABEL[role]}`); }
    const invited = !pw && !(u && u.password);
    st.modal = null; toast(invited ? `Login criado. ${data.first} recebeu um e-mail em ${email} para definir a password (na demonstração: "Esqueci-me da password" no login).` : u ? 'Acesso atualizado.' : `Login criado. Já pode entrar com ${email}.`);
  },
  checkout(fd) { const a = asset(st.modal.id); const err = checkout(a, fd.get('tt'), +fd.get('target'), fd.get('expected'), fd.get('note').trim()); if (err) { st.modal.error = err; return render(); } st.modal = null; toast(`Check-out de ${a.tag} feito.`); },
  checkin(fd) { const a = asset(st.modal.id); checkin(a, +fd.get('status'), +fd.get('location') || null, fd.get('note').trim()); st.modal = null; toast(`Check-in de ${a.tag} feito.`); },
  'edit-asset'(fd) {
    const a = asset(st.modal.id), brand = fd.get('brand').trim(), mname = fd.get('model').trim(), catId = +fd.get('category'), serial = fd.get('serial').trim();
    if (serial && db.assets.some(x => x.id !== a.id && !x.deleted && x.serial && norm(x.serial) === norm(serial))) { st.modal.error = `O n.º de série ${serial} já existe noutro asset.`; return render(); }
    let mk = findMaker(brand); if (!mk) { mk = { id: nextId(), name: brand }; db.manufacturers.push(mk); }
    let md = findModel(mk.id, mname); if (!md) { md = { id: nextId(), manufacturer: mk.id, name: mname, category: catId }; db.models.push(md); } else if (md.category !== catId) md.category = catId;
    const before = `${modelLabel(a.model)}${a.serial ? ' · ' + a.serial : ''}`;
    Object.assign(a, { model: md.id, serial, name: fd.get('name').trim(), notes: fd.get('notes').trim() });
    log('update', 'asset', a.id, null, `${before} → ${modelLabel(a.model)}${a.serial ? ' · ' + a.serial : ''}`); st.modal = null;
    toast(missing(a).length ? `Guardado. Ainda falta: ${missing(a).join(', ')}.` : 'Guardado. Ficou completo.');
  },
  status(fd) { const a = asset(st.modal.id), old = status(a.status).name; a.status = +fd.get('status'); log('update', 'asset', a.id, null, `Estado: ${old} → ${status(a.status).name}${fd.get('note') ? ' · ' + fd.get('note') : ''}`); st.modal = null; toast('Estado atualizado.'); },
  transfer(fd) { const a = asset(st.modal.id); if (isAssigned(a)) { st.modal.error = 'Faz check-in antes de mudar de empresa.'; return render(); } const from = company(a.company).code, to = +fd.get('company'); a.company = to; const oldTag = a.tag; if (fd.get('retag')) a.tag = nextTag(to); a.location = null; log('transfer', 'asset', a.id, null, `${fd.get('note') || ''}${a.tag !== oldTag ? ` (tag ${oldTag} → ${a.tag})` : ''}`.trim(), { from, to: company(to).code }); st.modal = null; if (!inScope(to)) st.detail = null; toast(`${a.tag} passou para ${company(to).name}.`); },
  delete() { const a = asset(st.modal.id); if (isAssigned(a)) { st.modal.error = 'Faz check-in antes de apagar.'; return render(); } a.deleted = true; log('delete', 'asset', a.id); st.modal = null; st.detail = null; toast(`${a.tag} apagado.`); },
  'new-kind'(fd) {
    const k = st.modal.kind, c = +fd.get('company'), mdl = +fd.get('model'), custom = {};
    for (const [key, val] of fd.entries()) if (key.startsWith('c_') && val.trim()) custom[key.slice(2)] = val.trim();
    if (k === 'line') { if (!/^9[1236]\d{7}$/.test(custom.numero || '')) { st.modal.error = 'O número tem de ter 9 dígitos e começar por 91, 92, 93 ou 96.'; return render(); } if (db.assets.some(a => a.custom.numero === custom.numero && !a.deleted)) { st.modal.error = 'Esse número já existe.'; return render(); } if (custom.pin && !/^\d{4,8}$/.test(custom.pin)) { st.modal.error = 'O PIN tem de ter 4 a 8 dígitos.'; return render(); } if (custom.puk && !/^\d{8}$/.test(custom.puk)) { st.modal.error = 'O PUK tem de ter 8 dígitos.'; return render(); } }
    if (custom.ip && !/^(\d{1,3}\.){3}\d{1,3}$/.test(custom.ip)) { st.modal.error = 'Endereço IP inválido.'; return render(); }
    const serial = (fd.get('serial') || '').trim();
    if (serial && db.assets.some(a => a.serial && a.serial.toLowerCase() === serial.toLowerCase())) { st.modal.error = 'Esse n.º de série já existe.'; return render(); }
    const a = { id: nextId(), company: c, model: mdl, status: 1, tag: nextTag(c), name: k === 'line' ? custom.numero.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : (custom.hostname || ''), serial, purchaseDate: '', cost: '', warranty: '', location: fd.get('location') ? +fd.get('location') : null, assigned: null, expected: '', notes: '', custom, created: new Date().toISOString() };
    db.assets.push(a); log('create', 'asset', a.id);
    if (a.location && k !== 'line') checkout(a, 'location', a.location, '', 'Instalado');
    st.modal = null; st.detail = a.id; toast(`${a.tag} registado.`);
  },
  'acc-out'(fd) { const x = db.accessories.find(y => y.id === st.modal.id), qty = Math.max(1, +fd.get('qty') || 1), u = user(+fd.get('user')); if (!u) { st.modal.error = 'Escolhe a pessoa.'; return render(); } if (qty > accAvail(x)) { st.modal.error = 'Não há unidades suficientes.'; return render(); } if (u.company && u.company !== x.company && !isAdmin()) { st.modal.error = 'O utilizador é de outra empresa.'; return render(); } for (let i = 0; i < qty; i++) db.accCheckouts.push({ id: nextId(), acc: x.id, user: u.id, at: new Date().toISOString(), inAt: null }); log('checkout', 'accessory', x.id, { type: 'user', id: u.id }, fd.get('note'), { qty }); st.modal = null; toast(`${qty} × ${x.name} entregue a ${uname(u)}.`); },
  'new-acc'(fd) { const x = { id: nextId(), name: fd.get('name').trim(), category: fd.get('category').trim() || 'Outros', company: +fd.get('company'), qty: +fd.get('qty') || 0, min: +fd.get('min') || 0 }; db.accessories.push(x); log('create', 'accessory', x.id); st.modal = null; toast('Acessório criado.'); },
  'new-user'(fd) { const email = fd.get('email').trim(); if (email && db.users.some(u => u.email === email)) { st.modal.error = 'Esse e-mail já existe.'; return render(); } const u = { id: nextId(), first: fd.get('first').trim(), last: fd.get('last').trim(), email, company: +fd.get('company'), active: true }; db.users.push(u); log('create', 'user', u.id); st.modal = null; toast(`${uname(u)} criado.`); }
};

document.addEventListener('click', e => {
  if (st.menu && !e.target.closest('.menu-wrap')) { st.menu = null; if (!e.target.closest('[data-act]')) return render(); }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); fn(el.dataset, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.imp === 'text') { impState().text = el.value; return render(); }
  if (el.dataset.input === 'q') { st.q[el.dataset.page] = el.value; render(); }
  else if (el.dataset.nf && el.type !== 'checkbox' && el.tagName !== 'SELECT') { newForm()[el.dataset.nf] = el.value; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.imp === 'company') { impState().company = +el.value; return render(); }
  if (el.dataset.impMap != null) { impState().map[+el.dataset.impMap] = el.value; return render(); }
  if (el.dataset.impCheck) { impState()[el.dataset.impCheck] = el.checked; return render(); }
  if (el.hasAttribute('data-imp-file') && el.files[0]) {
    const f = el.files[0];
    if (/\.xlsx?$/i.test(f.name)) return toast('Na demonstração não se lê .xlsx: copia as células no Excel e cola na caixa. A aplicação real lê .xlsx diretamente.', true);
    const rd = new FileReader(); rd.onload = () => { const s = impState(); s.text = String(rd.result); s.fileName = f.name; render(); }; rd.readAsText(f, 'utf-8'); return;
  }
  if (el.dataset.change === 'company') { db.ui.company = el.value === 'all' ? 'all' : +el.value; st.detail = null; render(); }
  else if (el.dataset.actChange === 'login-role') { const f = el.form; f.querySelector('[data-role-admin]').hidden = el.value !== 'admin'; f.querySelector('[data-role-other]').hidden = el.value === 'admin'; }
  else if (el.dataset.change === 'role') { db.ui.role = +el.value; if (db.ui.company !== 'all' && !myCompanies().includes(db.ui.company)) db.ui.company = 'all'; st.revealed = {}; st.modal = null; if (st.detail && !inScope(asset(st.detail).company)) st.detail = null; if (st.page === 'novo' && !canWrite()) location.hash = 'painel'; render(); toast(`Sessão ativa: ${uname(me())} (${ROLE_LABEL[me().role]}).`); }
  else if (el.dataset.nf) { const f = newForm(); if (el.type === 'checkbox') f[el.dataset.nf] = el.checked; else { f[el.dataset.nf] = el.dataset.nf === 'company' ? +el.value : el.value; if (el.dataset.nf === 'company') f.location = ''; } render(); }
});
document.addEventListener('submit', e => { e.preventDefault(); const fn = forms[e.target.dataset.form]; if (fn) fn(new FormData(e.target)); });
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && e.target.id === 'imp-text') { e.preventDefault(); const t = e.target, a = t.selectionStart; t.value = t.value.slice(0, a) + '\t' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = a + 1; impState().text = t.value; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (st.modal || st.menu)) { st.modal = null; st.menu = null; render(); } });
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
